# Ce qui suit la lignée 26.1 du jeu (alias `mc261`). Lu par le module mc-26.1. Les
# catalogues de version portent les mêmes clés : un module de version ne diffère du
# suivant que par l'alias qu'il lit.

[versions]

minecraft = "26.1.2" # La dernière release de la lignée 26.1 (correctif du 2026-04-09) : le jar ne sert qu'elle
fabric-api = "0.155.3+26.1.2" # Fabric API : la dernière publiée pour 26.1.2

# Le module GameTest de Fabric API, absent du jar agrégé : l'étage 2 des tests, le serveur
# de test. Sa version se lit dans le POM de fabric-api, dépendance
# fabric-gametest-api-v1, et se monte avec elle.
fabric-gametest-api = "4.0.18+867b87624c"

# Brigadier, celui que le jeu de cette version embarque. common lit celui de la dernière
# release pour l'étage 0 de ses tests, qui travaille sur des arbres synthétiques, sans
# Minecraft au classpath.
brigadier = "1.3.10"


[libraries]

minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-gametest-api = { module = "net.fabricmc.fabric-api:fabric-gametest-api-v1", version.ref = "fabric-gametest-api" }
brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }
