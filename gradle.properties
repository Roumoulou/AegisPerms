# Mémoire allouée à Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Le kit C:\MC-Kit vaut sur chaque poste : son entrepôt se déclare ici (Outfitter 0.4.0). Le
# joueur des runs client, propre à la personne (outfitter.username, outfitter.login), n'est
# PAS ici : il vit dans machine.properties, qui n'est jamais versionné, sous les clés
# outfitter.* que le plugin lit, où un poste qui range le kit ailleurs surcharge aussi ses
# chemins. Un clone n'hérite ainsi pas du pseudo de l'auteur.

# Mod Properties
# mod_id est l'identifiant Fabric, déclaré UNE seule fois : processResources l'injecte
# dans fabric.mod.json, le build s'en sert (bloc mods de Loom, groupe de tâches) et
# Outfitter aussi (nom du jar déployé, mod jamais recopié depuis l'instance, logger de
# levels.xml).
# mod_version ne porte pas la version du jeu : chaque module de version la complète de la
# sienne (1.0.0+26.3).
mod_id=aegisperms
mod_version=1.0.0
maven_group=fr.moulou
archives_base_name=aegisperms

# La publication sur Modrinth et CurseForge (section 9 du plugin de version) : les deux
# projets, par leurs identifiants, publics et stables. Celui de Modrinth est l'identifiant
# à huit caractères de la page du projet, pas son adresse. Vides tant que les projets ne
# sont pas créés : l'essai à blanc passe sans eux, l'envoi réel refuse.
# Les jetons ne vivent jamais ici : MODRINTH_TOKEN et CURSEFORGE_TOKEN, posés par
# dev-secrets.ps1 dans le terminal qui publie. Un envoi réel se demande à la commande,
# -Ppublish_live=true ; sans lui, publishMods est un essai à blanc.
modrinth_project_id=
curseforge_project_id=

# L'entrepôt du kit, deux racines classées par version de Minecraft (celle du catalogue de
# chaque module) : les profils (options.txt, server.properties, eula.txt, configs, packs) et
# les maps ; sans le dossier de la version exacte, celui de la lignée sert, et Outfitter le
# dit. Barres obliques : un .properties lit l'antislash comme un échappement.
outfitter.profiles_dir=C:/MC-Kit/00-favorites
outfitter.maps_dir=C:/MC-Kit/01-maps

# Le modpack des environnements moddés (`serverModded` de mc-26.2 et de mc-26.3) : le
# projet PackTool qui le sert, par son identifiant stable (projet.json de l'atelier).
# L'instance de référence, le solo publié de ce modpack dans le kit, est propre à chaque
# lignée : outfitter.reference_instance_dir vit dans le gradle.properties du module de
# version. Le lanceur et l'atelier de PackTool sont propres au poste
# (outfitter.content_tool_executable, outfitter.content_tool_dir, dans machine.properties).
outfitter.content_project=mdtk

# Les maps de l'entrepôt copiées dans les saves des clients de dev : noms exacts,
# séparés par des virgules, catégorie jamais mentionnée. Clé absente ou vide :
# toutes les maps de l'entrepôt. Un client de dev ne fait que rejoindre le serveur de
# dev : une seule map légère suffit. machine.properties peut la surcharger par poste.
# Le monde du serveur ne dépend pas d'elle (voir outfitter.server_world), et retirer
# une map d'ici n'efface pas sa copie déjà dans un environnement.
outfitter.maps=World_Flat_MushroomFields

# Le monde de départ des serveurs de dev (runServer), copié sous `world` : un nom exact
# de l'entrepôt de maps. Vide, c'est la clé "world" du profile.json du profil `dev` de
# l'entrepôt qui décide, sinon la première map par ordre alphabétique. Un nom
# introuvable est signalé et retombe au cran suivant. machine.properties peut surcharger.
outfitter.server_world=

# Les logs des runs, trois clés indépendantes (les montages log4j sont des ressources
# d'Outfitter, extraits dans build\outfitter\log4j\ avant chaque run).
# outfitter.log_level règle la console de TOUT LE MONDE (trace, debug, info, warn, error ;
# vide = info, le défaut Fabric) ; outfitter.mod_log_level ne règle que le logger du mod,
# pour voir son debug sans le bruit des autres. machine.properties peut surcharger par
# poste, -P dépanne ponctuellement, et logs/debug.log reçoit toujours tout, quels que
# soient ces réglages.
outfitter.log_level=info
outfitter.mod_log_level=debug

# Le FORMAT de la console : vide = l'habillage de Loom ; `compact` (une ligne, emoji
# par niveau, héritier du soft-compact d'Enhanced Terminal Logging) ou `details`
# (deux lignes avec Classe::Méthode(Ligne) et PID, le diagnostic poussé, plus lent).
outfitter.log_format=compact
